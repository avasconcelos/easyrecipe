name: Release

# Pushing a tag such as v0.1.0 packages the addon and uploads it to CurseForge
# and to a GitHub release. The tag becomes the addon's version.
on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run tests
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1
          lua5.1 tests/run.lua

      # Needs the CF_API_TOKEN repository secret and the
      # "## X-Curse-Project-ID" line in EasyRecipe.toc.
      - uses: BigWigsMods/packager@v2
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          GH_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
